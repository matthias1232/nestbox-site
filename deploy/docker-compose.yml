# Nestbox appliance — full stack.
#
# PostgreSQL is the single control store (ADR 0001). It runs locally as a
# container and holds no secret values: credentials live as locators (ADR 0005)
# in the mounted secret directory.
#
# Every image is pinned by digest deliberately. `latest` is rejected by the
# image policy test, and a floating tag would let a registry change the running
# system without a review.

name: nestbox

services:
  # Creates the data and secret directories with the right ownership before the
  # API starts. Runs once and exits.
  init-data:
    image: alpine:3.21
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data/gateway /secrets /secrets/node /secrets/ssh
        # The node token authenticates the control API to the runner's terminal
        # endpoint. It lives in its own directory because the runner mounts that
        # directory and must not see the database URLs next to it.
        #
        # Generated here rather than required from the operator: a missing file
        # would otherwise fail `up`, and a terminal without a token must not be
        # an option. Idempotent: an existing token is left alone, so a restart
        # cannot silently invalidate the file an operator is holding.
        #
        # Hex on purpose: the token travels as the second entry of
        # `Sec-WebSocket-Protocol`, and base64's `+`, `/`, `=` are not valid in
        # a protocol token — the handshake would fail with a bare 400.
        [ -s /secrets/node/token ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/node/token
        # The secret store's master key (ADR 0037): 32 random bytes as 64 hex
        # characters. Idempotent, and never regenerated: a new key would make every
        # stored secret unreadable. It lives beside the other secrets, not in the
        # database, so a database copy is not a copy of the keys.
        [ -s /secrets/vault_key ] || head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/vault_key
        chmod 0400 /secrets/vault_key
        chown -R 10001:10001 /data /secrets
        # The MCP hub's shared token: one file the control API reads (it hands the
        # token to the agents' environment) and one copy only the hub's user can read.
        [ -s /secrets/mcp_hub_token ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/mcp_hub_token
        # Media rendering has two tokens, not one. The agent presents the first to
        # the media MCP server; that server presents the second to the control
        # API. An agent that learns its own token therefore cannot render for a
        # sandbox it is not attached to: the bridge token is the only one the
        # control API accepts for that route.
        [ -s /secrets/accounting_token ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/accounting_token
        # Readable by the API's unprivileged user: init-data runs as root and the
        # chown above already ran, so a 0600 file here would be unreadable and the
        # ingest would answer 503 with no visible reason.
        chmod 0644 /secrets/accounting_token
        mkdir -p /data/accounting-secrets
        cp /secrets/accounting_token /data/accounting-secrets/token
        chmod 0755 /data/accounting-secrets
        chmod 0444 /data/accounting-secrets/token
        [ -s /secrets/media_mcp_token ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/media_mcp_token
        [ -s /secrets/media_bridge_token ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/media_bridge_token
        mkdir -p /data/media /data/media-secrets
        # The media server runs as its own unprivileged user (uid 10003 inside its
        # image). `/secrets` is 0700 for the API's user, so a file there is
        # unreachable no matter its own mode; the copies therefore live under
        # /data, in a directory only this directory's mount exposes.
        cp /secrets/media_mcp_token /data/media-secrets/token
        cp /secrets/media_bridge_token /data/media-secrets/bridge
        chmod 0755 /data/media-secrets
        chmod 0444 /data/media-secrets/token /data/media-secrets/bridge
        mkdir -p /secrets/mcp
        cp /secrets/mcp_hub_token /secrets/mcp/token
        chown -R 10002:10002 /secrets/mcp
        chmod 0500 /secrets/mcp
        chmod 0400 /secrets/mcp/token
        chown 10001:10001 /secrets/mcp_hub_token
        # The egress proxy runs as `envoy` (uid 101) and must present the node
        # token on every policy check. It gets its own copy, in its own directory,
        # readable by it alone: the proxy mounts nothing else from secrets/.
        mkdir -p /secrets/proxy
        cp /secrets/node/token /secrets/proxy/node-token
        # The certificate broker runs in the same container and signs leaf
        # certificates with the egress CA, so it needs the key. A Docker secret
        # keeps the host file's owner and mode (0600, another uid), so the broker
        # could not read it and exited; the copy below is owned by the proxy user.
        if [ -s /secrets/egress/ca.crt ] && [ -s /secrets/egress/ca.key ]; then
          cp /secrets/egress/ca.crt /secrets/proxy/egress-ca.crt
          cp /secrets/egress/ca.key /secrets/proxy/egress-ca.key
        fi
        chown -R 101:101 /secrets/proxy
        chmod 0500 /secrets/proxy
        chmod 0400 /secrets/proxy/node-token
        chmod 0400 /secrets/proxy/egress-ca.crt /secrets/proxy/egress-ca.key 2>/dev/null || true
        chmod 0700 /secrets
        find /secrets -type f -exec chmod 0600 {} + 2>/dev/null || true
        echo "data and secret directories prepared"
    volumes:
      - ./data:/data
      - ./secrets:/secrets

  postgres:
    # Pinned by digest in production; the tag is kept for readability.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nestbox
      POSTGRES_USER: nestbox
      # The password is read from a file, never from the compose environment,
      # so it does not appear in `docker inspect` (ADR 0005).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Fail fast rather than silently initialise a different cluster.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets:
      - postgres_password
    volumes:
      - nestbox-postgres:/var/lib/postgresql/data
      # Creates the least-privilege application role on first initialisation.
      - ./postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestbox -d nestbox"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published on the host: only the API needs it, and a database on a
    # public interface is an unnecessary exposure.
    expose:
      - "5432"
    networks:
      - control

  migrate:
    build:
      # `services/` and not the crate folder: the binary embeds the supervisor
      # program from `tool-images/`, so the context has to contain both.
      context: ../services
      dockerfile: control-api-rust/Dockerfile
    # Runs the migrations and exits. The API waits for this to complete, so a
    # schema change never races the application startup.
    #
    # Migrations connect as the schema owner. The API connects as nestbox_app,
    # which is what makes row-level security apply to it.
    command: ["/usr/local/bin/nestbox-control-api", "migrate"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url_admin
      NESTBOX_BOOTSTRAP_ADMIN: "true"
      RUST_LOG: info
    secrets:
      - database_url_admin
    depends_on:
      postgres:
        condition: service_healthy
      init-data:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - control

  control-api:
    build:
      context: ../services
      dockerfile: control-api-rust/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NESTBOX_RUNNER_URL: http://sandbox-runner:9000
      # The name Compose actually gives the network, not a hand-written one.
      # `nestbox-runtime` and `nestbox_runtime` are two different bridges, and a
      # mismatch puts sandboxes on a network that is not the internal one the
      # proxy and the API are attached to.
      NESTBOX_RUNTIME_NETWORK: ${COMPOSE_PROJECT_NAME:-nestbox}_runtime
      NESTBOX_SECRET_DIR: /secrets
      # "openshell" creates new sandboxes on the OpenShell gateway.
      NESTBOX_SANDBOX_RUNTIME: ${NESTBOX_SANDBOX_RUNTIME:-openshell}
      # Where an agent finds the Nestbox MCP hub. On OpenShell the hub is reached
      # through the host (see the mcp-hub service).
      NESTBOX_MCP_HUB_URL: ${NESTBOX_MCP_HUB_URL:-}
      # Where an agent reaches the media MCP server. On OpenShell the compose name
      # is not resolvable from a host-network supervisor, so a deployment sets this
      # to the host.openshell.internal form the hub already uses.
      NESTBOX_MEDIA_MCP_URL: ${NESTBOX_MEDIA_MCP_URL:-}
      # Rendered assets: a volume, not the container's writable layer, so a
      # rebuild does not delete what an operator asked to keep.
      NESTBOX_MEDIA_DIR: /var/lib/nestbox/media
      # The media MCP server's bridge token. The route it calls refuses every
      # request while this is missing.
      NESTBOX_MEDIA_BRIDGE_TOKEN_FILE: /secrets/media_bridge_token
      NESTBOX_ACCOUNTING_TOKEN_FILE: /secrets/accounting_token
      # Opt-in: set to the address a sandbox reaches the accounting proxy at
      # (OpenShell: http://host.openshell.internal:18099) and every agent's model
      # base URL is routed through it, with the sandbox named in the path.
      NESTBOX_ACCOUNTING_PROXY_URL: ${NESTBOX_ACCOUNTING_PROXY_URL:-}
      NESTBOX_SESSION_COOKIE_SECURE: "false"
      # The same token the runner demands on the terminal upgrade. It comes from
      # the node directory rather than from a compose secret, because compose
      # checks a secret file when it creates the container — before `init-data`
      # can generate one — and a fresh appliance would fail to start. It is not
      # mounted under `/run/secrets`: that directory belongs to the compose
      # secrets and is mounted read-only, so a second mount below it fails.
      NESTBOX_NODE_TOKEN_FILE: /run/node/token
      # Joining nodes over the overlay (ADR 0047). Empty endpoint = joining is off.
      NESTBOX_OVERLAY_DIR: /overlay
      NESTBOX_OVERLAY_ENDPOINT: ${NESTBOX_OVERLAY_ENDPOINT:-}
      NESTBOX_PUBLIC_URL: ${NESTBOX_PUBLIC_URL:-}
      NESTBOX_MODE: ${NESTBOX_MODE:-selfhosted}
      # How often a folder that works on a joined node is snapshotted (minutes).
      NESTBOX_SNAPSHOT_MINUTES: ${NESTBOX_SNAPSHOT_MINUTES:-15}
      NESTBOX_OIDC_PROVIDERS: ${NESTBOX_OIDC_PROVIDERS:-}
      NESTBOX_OIDC_GOOGLE_CLIENT_ID: ${NESTBOX_OIDC_GOOGLE_CLIENT_ID:-}
      NESTBOX_OIDC_GOOGLE_CLIENT_SECRET: ${NESTBOX_OIDC_GOOGLE_CLIENT_SECRET:-}
      NESTBOX_OIDC_GITHUB_CLIENT_ID: ${NESTBOX_OIDC_GITHUB_CLIENT_ID:-}
      NESTBOX_OIDC_GITHUB_CLIENT_SECRET: ${NESTBOX_OIDC_GITHUB_CLIENT_SECRET:-}
      RUST_LOG: info,tower_http=warn
    secrets:
      - database_url
    volumes:
      - ./data/gateway:/data/gateway:ro
      - ./data/media:/var/lib/nestbox/media
      - ./secrets:/secrets:ro
      # The one place the API writes a secret: each sandbox's SSH key pair, made at
      # create time (ADR 0024). It must be writable, or no sandbox gets a key and
      # provisioning fails with an internal error. The rest of /secrets stays
      # read-only, and the runner never mounts this directory.
      - ./secrets/ssh:/secrets/ssh
      - ./secrets/node:/run/node:ro
      # The hub's public key (read) and the peer list (written): see overlay-hub.
      - ./data/overlay:/overlay
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init-data:
        condition: service_completed_successfully
    expose:
      - "8000"
    # Loopback only: the overlay hub forwards it to the hub address for joined nodes.
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      - control
      - runtime

  # The WireGuard hub and the image registry for nodes on other machines (ADR 0047, 0048).
  # Both run on the host network: the hub owns the `nb-hub` interface, and the registry listens
  # on the host's loopback (the hub forwards it to the overlay address).
  overlay-hub:
    build:
      context: ./overlay-hub
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      NESTBOX_OVERLAY_HUB_IP: ${NESTBOX_OVERLAY_HUB_IP:-10.77.0.1}
      NESTBOX_OVERLAY_PORT: ${NESTBOX_OVERLAY_PORT:-51821}
    volumes:
      - ./data/overlay:/overlay

  registry:
    image: registry:2
    restart: unless-stopped
    network_mode: host
    environment:
      REGISTRY_HTTP_ADDR: 127.0.0.1:5000
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - ./data/registry:/var/lib/registry

  # Where snapshots of persistent folders are kept (ADR 0049): a restic REST server, listening on
  # the overlay address only. Append-only: a node can add snapshots and never delete one, and the
  # data is encrypted with a password per data center that the server never sees.
  restic-server:
    image: restic/rest-server:0.13.0
    restart: unless-stopped
    network_mode: host
    command: ["rest-server", "--path", "/data", "--listen", "${NESTBOX_OVERLAY_HUB_IP:-10.77.0.1}:8500", "--append-only", "--no-auth"]
    volumes:
      - ./data/restic:/data

  web-console:
    build:
      context: ../services/web-console-solid
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - control-api
    ports:
      - "8080:8080"
    networks:
      - control

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/gateway:/var/log/nginx
    expose:
      - "8081"
    networks:
      - control

  sandbox-runner:
    build:
      context: ../services/sandbox-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NESTBOX_ALLOWED_IMAGES: ubuntu:24.04,debian:12-slim,rockylinux:9,fedora:41,alpine:3.21,nestbox-ubuntu-dev:local,nestbox-hermes:local,nestbox-openclaw:local,nestbox-tool-git:local,nestbox-claude-code:local,nestbox-openchamber:local
      # See control-api: this must be the Compose network, or the runner creates
      # a second bridge and every sandbox/model lands on the wrong one.
      NESTBOX_RUNTIME_NETWORK: ${COMPOSE_PROJECT_NAME:-nestbox}_runtime
      # Bind mounts for persistent roots come only from this tree.
      NESTBOX_PERSISTENT_BASE: /var/lib/nestbox/persistent
      # The host's /proc, so the hardware report describes the machine.
      NESTBOX_HOST_PROC: /host/proc
      # Model artefacts. The runner fetches them and starts one server
      # container per install; both use this path, inside and out, so the bind
      # source it validates is the directory Docker mounts.
      NESTBOX_MODEL_BASE: /var/lib/nestbox/models
      # The only images a model server may start, by digest (ADR 0022). An
      # image is a dependency with a version, and `latest` is not a version.
      NESTBOX_MODEL_IMAGES: ghcr.io/ggml-org/llama.cpp@sha256:8ee4ec7ce58a921313d07390c6699af13aa5ec083f3cdf67e5f4155767047373
      # A single download may not exceed this, whatever the API asks for.
      NESTBOX_MODEL_MAX_BYTES: "34359738368"
      # CUDA-X components the catalogue may install on this node. Exact
      # references only; the runner refuses anything else.
      NESTBOX_CUDAX_IMAGES: "nvidia/cuda:12.9.0-devel-ubuntu24.04,nvcr.io/nvidia/tensorrt:latest,nvcr.io/nvidia/tensorrt-llm/release:latest,nvcr.io/nim/meta/llama-3.1-8b-instruct:latest,nvcr.io/nvidia/tritonserver:latest,vllm/vllm-openai:latest,lmsysorg/sglang:latest,nvcr.io/nvidia/dcgm:latest,nvcr.io/nvidia/nemo:latest,nvcr.io/nvidia/rapidsai/base:latest"
      # The terminal upgrade is refused without this token, and the runner also
      # sits on the sandbox network: an open endpoint there would be a shell into
      # every neighbour. It mounts the node directory, not `secrets/`: the
      # runner has the Docker socket and no business reading database URLs.
      NESTBOX_NODE_TOKEN_FILE: /run/node/token
      # Published ports. The runner listens on every port of this range for the
      # sandboxes' forwards (SSH, agent UIs) and compose publishes the same range
      # on the node. It must equal the node's pool (nodes.port_pool_start/end);
      # a forward outside it is reported as failed instead of silently closed.
      # Where the proxy's access log is delivered, and who the runner says it is
      # when it delivers it (the same node token the terminal check uses).
      NESTBOX_CONTROL_API_URL: http://control-api:8000
      # CPU, memory, network and disk of every sandbox, every five seconds.
      NESTBOX_METRICS_POST_URL: http://control-api:8000/api/v1/internal/metrics/batch
      NESTBOX_NODE_ID: ${NESTBOX_NODE_ID:-00000000-0000-0000-0000-000000000003}
      NESTBOX_ENVIRONMENT_ID: ${NESTBOX_ENVIRONMENT_ID:-00000000-0000-0000-0000-000000000002}
      NESTBOX_FORWARD_RANGE: ${NESTBOX_FORWARD_RANGE:-22200-22299}
      NESTBOX_RUNNER_STATE: /var/lib/nestbox-runner
      # Where a `direct` sandbox leaves the node: an ordinary bridge with a
      # route out, separate from the stack's control network.
      NESTBOX_DIRECT_NETWORK: ${COMPOSE_PROJECT_NAME:-nestbox}-sandbox-direct
      # The deployment CA. Mounted into a sandbox only when that sandbox's
      # egress mode reads TLS; the runner never reads its key. The path is the
      # host path, and the same directory is mounted at the same path below, so
      # the bind source the runner validates is the path Docker mounts.
      NESTBOX_EGRESS_CA: ${NESTBOX_EGRESS_CA_DIR:-/opt/nestbox/site/deploy/secrets/egress}/ca.crt
      # OpenShell sandboxes (runtime "openshell") are driven through the gateway.
      OPENSHELL_GATEWAY: openshell
    volumes:
      # Forwards, authorised keys and the SSH host key survive a redeploy.
      - nestbox-runner-state:/var/lib/nestbox-runner
      # The only component that talks to the Docker socket. It is separate from
      # the API on purpose: a compromise of the API does not yield the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent roots live here on the host; the same path inside and out
      # so a bind source the runner validates is the path Docker mounts.
      - /var/lib/nestbox/persistent:/var/lib/nestbox/persistent
      - /var/lib/nestbox/models:/var/lib/nestbox/models
      # Backups of persistent roots: one tar.gz each, written and read only by the runner.
      - /var/lib/nestbox/backups:/var/lib/nestbox/backups
      # The snapshot server's files, so the control plane can prune what the append-only server keeps.
      - ./data/restic:/var/lib/nestbox/restic
      - /proc:/host/proc:ro
      - ./secrets/node:/run/node:ro
      # The public CA copy the runner writes for sandboxes; same path in and out.
      - /var/lib/nestbox/egress:/var/lib/nestbox/egress
      # The deployment's egress CA directory, at the same path inside and out so
      # a sandbox bind source is the path Docker resolves on the host. Read-only:
      # the runner only passes the public certificate on.
      - ${NESTBOX_EGRESS_CA_DIR:-/opt/nestbox/site/deploy/secrets/egress}:${NESTBOX_EGRESS_CA_DIR:-/opt/nestbox/site/deploy/secrets/egress}:ro
      # The client bundle for the OpenShell gateway on the host (written by
      # deploy/openshell/install-openshell.sh): CA certificate, client certificate
      # and key. Writable only because the CLI keeps its "last sandbox" note there.
      - ./data/openshell-client:/root/.config/openshell
    extra_hosts:
      # The name the gateway's certificate already carries.
      - "host.openshell.internal:host-gateway"
    expose:
      - "9000"
    ports:
      # The sandboxes' published ports (SSH and agent UIs). Bound on the node's
      # LAN address by default; set NESTBOX_FORWARD_BIND to narrow it.
      - "${NESTBOX_FORWARD_BIND:-0.0.0.0}:${NESTBOX_FORWARD_RANGE:-22200-22299}:${NESTBOX_FORWARD_RANGE:-22200-22299}"
    networks:
      - control
      - runtime

  # The only way out of the sandbox network. Envoy asks the control API for a
  # decision per request (default deny, fail closed) and writes one JSON line per
  # request to stdout, which the control API ingests and redacts.
  #
  # It is the one component with NET_ADMIN and NET_RAW, and only for the redirect
  # rules that catch a tool which ignores HTTP_PROXY. It is not published on the
  # host: a forward proxy on a LAN interface with no authentication is an open
  # relay, and the sandboxes reach it over the `runtime` network by service name.
  egress-proxy:
    build:
      context: ../services/egress-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NESTBOX_NODE_NAME: local
      # Who this node is, and the token that proves it. The proxy presents both
      # on every policy check; without them the control API refuses the check and
      # every request is denied. The id is the seeded local node.
      NESTBOX_NODE_ID: ${NESTBOX_NODE_ID:-00000000-0000-0000-0000-000000000003}
      NESTBOX_NODE_TOKEN_FILE: /run/node/node-token
      NESTBOX_EGRESS_CA_CERT: /run/node/egress-ca.crt
      NESTBOX_EGRESS_CA_KEY: /run/node/egress-ca.key
    volumes:
      # A copy of the node token that only the proxy's user can read (made by
      # init-data). The proxy never sees the database URLs or the SSH keys.
      - ./secrets/proxy:/run/node:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    expose:
      - "3128"
    # An OpenShell sandbox has no route on the runtime network, so the compose
    # name is not resolvable from it. The supervisor runs on the host network and
    # reaches a loopback publish as `host.openshell.internal:<port>` — the same
    # form the MCP hub uses. This is the address a gateway sandbox is told to use
    # as its proxy (`NESTBOX_OPENSHELL_PROXY_URL`), and the policy grants the hop
    # to it. Loopback-only: a forward proxy on a LAN interface is an open relay.
    ports:
      - "127.0.0.1:18087:3128"
    depends_on:
      - control-api
    # Upstream: `control` (has a default route, reaches the LAN and the internet).
    # Downstream: `runtime` is internal, which is what makes the proxy the only
    # way out for a sandbox.
    networks:
      - control
      - runtime

  # The MCP server every agent sandbox is attached to (the registry entry
  # `nestbox-hub`). It lives on the sandbox network under the name `mcp-hub`, so an
  # agent reaches it through the egress proxy and every tool call is a logged fact.
  mcp-hub:
    build:
      context: ../services/tool-images/mcp-hub
    image: nestbox-mcp-hub:local
    restart: unless-stopped
    entrypoint: ["sh", "-c", "NESTBOX_MCP_TOKEN=$$(cat /run/mcp/token) exec python3 /app/server.py"]
    volumes:
      - ./secrets/mcp:/run/mcp:ro
    # An OpenShell supervisor runs on the host network and cannot resolve the
    # compose name `mcp-hub`; it reaches the hub as host.openshell.internal:18088.
    # Loopback only: the bearer token still guards every call.
    ports:
      - "127.0.0.1:18088:8080"
    # `runtime` is internal, and Docker cannot publish a port of a container that
    # is only on an internal network: the hub also joins `control`.
    networks:
      - control
      - runtime

  # The accounting proxy: every agent request to a model provider passes here.
  # It forwards the client's own credential untouched, inspects the body against
  # the privacy policy, and records only metadata (model, tokens, cost).
  accounting-proxy:
    build:
      context: ../services/accounting-proxy
    image: nestbox-accounting-proxy:local
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - NESTBOX_ACCOUNTING_TOKEN=$$(cat /run/accounting/token) exec python3 /app/server.py
    environment:
      NESTBOX_CONTROL_API: http://control-api:8000
      NESTBOX_ACCOUNTING_PROXY_PORT: "8099"
    volumes:
      - ./data/accounting-secrets:/run/accounting:ro
    ports:
      - "127.0.0.1:18099:8099"
    networks:
      - control
      - runtime

  # Media rendering as MCP tools (`render_image`, `render_video`, `render_music`).
  # It holds no provider credential: it asks the control plane, which resolves the
  # model for the sandbox named in the agent's config and calls the provider.
  media-mcp:
    build:
      context: ../services/tool-images/media-mcp
    image: nestbox-media-mcp:local
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - NESTBOX_MCP_TOKEN=$$(cat /run/media/token) NESTBOX_MEDIA_BRIDGE_TOKEN=$$(cat /run/media/bridge) exec python3 /app/server.py
    environment:
      NESTBOX_CONTROL_URL: http://control-api:8000
    volumes:
      - ./data/media-secrets:/run/media:ro
    # Same reachability trade as the hub: loopback only, bearer token required.
    ports:
      - "127.0.0.1:18089:8080"
    networks:
      - control
      - runtime

  tool-image-ubuntu-dev:
    build:
      context: ../services/tool-images/ubuntu-dev
    image: nestbox-ubuntu-dev:local
    profiles: ["build-tools"]

  tool-image-hermes:
    build:
      context: ../services/tool-images/hermes
    image: nestbox-hermes:local
    profiles: ["build-tools"]

  tool-image-claude-code:
    build:
      context: ../services/tool-images/claude-code
    image: nestbox-claude-code:local
    profiles: ["build-tools"]

  tool-image-openchamber:
    build:
      context: ../services/tool-images/openchamber
    image: nestbox-openchamber:local
    profiles: ["build-tools"]

  tool-image-openclaw:
    build:
      context: ../services/tool-images/openclaw
    image: nestbox-openclaw:local
    profiles: ["build-tools"]

  tool-image-git:
    build:
      context: ../services/tool-images/git
    image: nestbox-tool-git:local
    profiles: ["build-tools"]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  database_url_admin:
    file: ./secrets/database_url_admin

volumes:
  nestbox-postgres:
  nestbox-runner-state:

networks:
  # Carries control traffic: browser to console, console to API, API to Postgres.
  control:
    internal: false
  # Carries sandbox traffic and is internal: a sandbox cannot reach the host
  # network directly, only the gateway.
  runtime:
    internal: true
