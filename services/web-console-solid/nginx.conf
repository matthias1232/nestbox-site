# The console and the API are served from one origin.
#
# That is a deliberate security choice: with a single origin there is no CORS
# policy to get wrong, and the session cookie can be SameSite=Lax.

server {
    # Docker's own resolver, asked again every few seconds. With a fixed name in
    # `proxy_pass` nginx resolves it once at start and keeps that address, so every
    # deploy of the control API that gave it a new address left the console on a
    # 502 until the console itself was restarted.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $control_api http://control-api:8000;
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Text assets are the only thing left to shrink: the entry bundle is 115 KB
    # raw, the stylesheet 58 KB, and the console is plain HTTP/1.1, where a
    # smaller body is the only speed left. Images and video are already
    # compressed, so only text types are listed, and `text/event-stream` is
    # deliberately absent — compression buffers a stream.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Both spellings of the JavaScript type: the mime map of newer nginx says
    # `text/javascript`, older releases said `application/javascript`. A type
    # that does not match the response skips gzip without saying so.
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # The terminal and the desktop are WebSockets on the same API. nginx needs the upgrade
    # dance and a long read timeout, and it must not send the empty `Connection`
    # header the SSE location below uses — hence a location of its own.
    location ~ ^/api/v1/sandboxes/[0-9a-fA-F-]+/(terminal|desktop)$ {
        proxy_pass $control_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A terminal is idle-by-design for minutes at a time. The control API
        # closes it after 30 minutes of no input; nginx must not close it first.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The API is proxied rather than published, so there is one entry point and
    # one place to add TLS later.
    location /api/ {
        proxy_pass $control_api;
        proxy_http_version 1.1;

        # Server-sent events must not be buffered, or the live console stops
        # being live. The same holds for compression, which also holds bytes
        # back until a block is full, so gzip is off for the whole prefix
        # rather than for each stream path: `/events/stream`, `/telemetry/stream`
        # and `/chats/stream` are all under `/api/`, and the next stream will be
        # too. Do not widen this.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app: unknown paths render the shell, which shows the login
    # screen or the requested view.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell names the content-hashed bundle, so a cached shell keeps an old
    # bundle alive after a deploy. That happened during the first Admin Center
    # rollout: the new code was running, the browser kept asking for the old
    # asset. `no-cache` still revalidates, so an unchanged shell costs a 304.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The bundle is content-hashed by Vite, so it can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The illustrations change only when the design changes, and the login loop
    # alone is 775 KB, so a day of caching is safe and saves the download on
    # every visit within it. A day rather than a year because the names are not
    # content-hashed: a new render must reach the browser the next day, not
    # after a cache purge.
    location /illustrations/ {
        add_header Cache-Control "public, max-age=86400";
    }
}
