# Envoy as the egress proxy for every sandbox on this node.
#
# Three jobs, two listeners:
#
#   1. **Decide.** Every request is sent to the control API before it leaves.
#      The control API owns the rules (ADR 0001); this file owns none. If the
#      control API cannot answer, the request is denied — `failure_mode_allow`
#      is off, which is the fail-closed half of "default deny".
#   2. **Terminate what it is allowed to see.** An HTTPS request arrives as a
#      CONNECT tunnel. The tunnel is not forwarded as an opaque pipe: Envoy
#      hands the client's TLS bytes to `egress-mitm` on loopback, which presents
#      a leaf certificate minted for the requested host from this node's CA,
#      decrypts, and re-encrypts to the second listener below. That listener
#      sees a normal HTTPS request, so the path, the body and the MCP facts are
#      visible instead of guessed.
#   3. **Record.** One JSON line per request: host, port, method, path, status,
#      duration, bytes, user agent, sandbox, TLS SNI, the MCP facts the Lua
#      filter extracted, and the decision the control API returned.
#
# Two listeners, because a request that was decrypted is a different request
# from the CONNECT that carried it:
#
#   * `egress` (0.0.0.0:3128) is what a sandbox talks to. Plain HTTP is routed
#     straight out; CONNECT is terminated and handed to the certificate broker.
#   * `egress_terminated` (127.0.0.1:10000) is loopback only. The broker
#     re-encrypts to it with the *original* SNI, so this listener's TLS session
#     reports the real server name in `%REQUESTED_SERVER_NAME%`.
#
# The CONNECT line and the decrypted request line are both logged. The first
# says "a tunnel to example.com:443 was allowed", the second says "it fetched
# / with 200". A UI that only shows one of them shows half of what happened.
#
# Why the broker is a separate loopback process and not a second Envoy: Envoy
# can terminate TLS, but it cannot mint a certificate per host name; a TLS
# server needs a certificate before it knows which one to present. The broker is
# ~200 lines of Go standard library (see `mitm/main.go`) and does nothing else:
# sign a leaf, terminate, hand the plaintext on. Every decision still comes from
# the control API through the filters below, and both listeners run the same
# filter chain, so there is no second policy.
#
# No listener is published on the host: the proxy is reachable from the sandbox
# network only. An unauthenticated forward proxy on a LAN interface is an open
# relay, and there is no reason to build one.

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    # ---------------------------------------------------------------------
    # 1. The listener a sandbox connects to.
    # ---------------------------------------------------------------------
    - name: egress
      address:
        socket_address: { address: 0.0.0.0, port_value: 3128 }
      # Both inspectors are needed: `http_inspector` recognises a CONNECT or a
      # plain HTTP request, `tls_inspector` recognises a raw TLS handshake from
      # a client that ignores the proxy environment variables.
      listener_filters:
        - name: envoy.filters.listener.http_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.http_inspector.v3.HttpInspector
        - name: envoy.filters.listener.tls_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress
                codec_type: AUTO
                # Mark RFC1918 downstreams as internal. This is the previous
                # default made explicit; without it Envoy 1.31 warns at every
                # start that the default will change.
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 10.0.0.0
                      prefix_len: 8
                    - address_prefix: 172.16.0.0
                      prefix_len: 12
                    - address_prefix: 192.168.0.0
                      prefix_len: 16
                # CONNECT is how a TLS client asks for a tunnel through a proxy.
                upgrade_configs:
                  - upgrade_type: CONNECT
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          ts: "%START_TIME%"
                          node: "%ENVIRONMENT(NESTBOX_NODE_NAME)%"
                          listener: proxy
                          sandbox: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-nestbox-sandbox)%"
                          # For a CONNECT this is `host:port`, for a plain
                          # request the Host header. `target_host`/`target_port`
                          # are the same value split by the Lua filter.
                          host: "%REQ(:authority)%"
                          target_host: "%DYNAMIC_METADATA(nestbox:target_host)%"
                          target_port: "%DYNAMIC_METADATA(nestbox:target_port)%"
                          method: "%REQ(:method)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          # Set only for CONNECT: there is no HTTP request inside
                          # a tunnel that this listener could describe.
                          connect: "%DYNAMIC_METADATA(nestbox:connect)%"
                          # A tunnel has no visible ClientHello, so this is the
                          # name the client asked for in its CONNECT. The
                          # decrypted request is logged by the other listener
                          # with the SNI it actually sent.
                          sni: "%DYNAMIC_METADATA(nestbox:sni)%"
                          protocol: "%PROTOCOL%"
                          app_protocol: "%DYNAMIC_METADATA(nestbox:app_protocol)%"
                          status: "%RESPONSE_CODE%"
                          duration_ms: "%DURATION%"
                          bytes_in: "%BYTES_RECEIVED%"
                          bytes_out: "%BYTES_SENT%"
                          user_agent: "%REQ(user-agent)%"
                          request_id: "%REQ(x-request-id)%"
                          mcp_session_id: "%DYNAMIC_METADATA(nestbox:mcp_session_id)%"
                          mcp_method: "%DYNAMIC_METADATA(nestbox:mcp_method)%"
                          mcp_tool: "%DYNAMIC_METADATA(nestbox:mcp_tool)%"
                          mcp_is_error: "%DYNAMIC_METADATA(nestbox:mcp_is_error)%"
                          mcp_result_kind: "%DYNAMIC_METADATA(nestbox:mcp_result_kind)%"
                          request_body: "%DYNAMIC_METADATA(nestbox:request_body)%"
                          response_body: "%DYNAMIC_METADATA(nestbox:response_body)%"
                          usage: "%DYNAMIC_METADATA(nestbox:usage)%"
                          cache_markers: "%DYNAMIC_METADATA(nestbox:cache_markers)%"
                          llm_auth: "%DYNAMIC_METADATA(nestbox:llm_auth)%"
                          # The decision the control API made, copied out of the
                          # ext_authz response headers into filter metadata (see
                          # `dynamic_metadata_from_headers` below). Empty until
                          # a decider answers, which is the truth and not a bug.
                          decision: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-nestbox-decision)%"
                          # 1 when only a window or an allow-all mode let this
                          # through; the decision above is then allow.
                          would_deny: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-nestbox-would-deny)%"
                          reason: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-nestbox-reason)%"
                          rule_id: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-nestbox-rule-id)%"
                route_config:
                  name: egress
                  virtual_hosts:
                    - name: forward
                      domains: ["*"]
                      routes:
                        # HTTPS: the CONNECT is asked about like any request. The
                        # decision is on the destination the client named
                        # (host and port), made before a single byte is
                        # tunnelled; what is inside the encrypted stream is not
                        # read, and the log says so (`connect: true`, no path).
                        # `connect_config` makes Envoy strip the CONNECT headers
                        # and forward the payload as raw TCP.
                        #
                        # Reading inside TLS needs the certificate broker and a CA
                        # trusted by every client. That is a separate, deliberate
                        # mode (`tls_terminator`, listener 2 below), not the
                        # default: a tunnel that cannot be read should be
                        # allowed or denied by name, not broken.
                        # Inspection route: the Lua filter marks a CONNECT whose
                        # sandbox is in `transparent` or `hybrid` mode. Anything
                        # not marked stays on the tunnel route below, so an
                        # unmarked connection can never be decrypted by accident.
                        - match:
                            connect_matcher: {}
                            headers:
                              - name: x-nestbox-inspect
                                exact_match: "1"
                          route:
                            cluster: tls_terminator
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                            timeout: 0s
                            # Short so a changed egress mode reaches the next
                            # connection within seconds (ADR 0052).
                            idle_timeout: 10s
                          typed_per_filter_config:
                            envoy.filters.http.buffer:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.BufferPerRoute
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { connect_matcher: {} }
                          route:
                            cluster: dynamic_forward_proxy_cluster
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                            # A tunnel may legitimately be idle for a while; it
                            # is the idle timeout, not the request timeout, that
                            # ends a dead one. Short so a changed egress mode
                            # reaches the next connection within seconds
                            # (ADR 0052).
                            timeout: 0s
                            idle_timeout: 10s
                          typed_per_filter_config:
                            # The buffer filter waits for the end of the request
                            # body, and a CONNECT's body is the tunnel: it ends
                            # when the client is done, long after the client is
                            # waiting for the 200. Without this, every CONNECT
                            # hangs until the client gives up.
                            envoy.filters.http.buffer:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.BufferPerRoute
                              disabled: true
                            # The Lua filter asks the control API about a tunnel itself
                            # (`check_tunnel` in mcp.lua): ext_authz cannot carry a
                            # CONNECT to an HTTP authorization service.
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        # Plain HTTP: host from `:authority`, no CONNECT.
                        - match: { prefix: "/" }
                          route:
                            cluster: dynamic_forward_proxy_cluster
                            timeout: 300s
                            idle_timeout: 60s
                http_filters:
                  # Buffer up to 64 KiB so the Lua filter can read a JSON-RPC
                  # body. Larger bodies are streamed through unbuffered and are
                  # logged as metadata only — the honest limit of "we record
                  # bodies up to 64 KiB".
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 65536
                  # Lua next: it reads the body to recognise MCP and writes the
                  # tool name into dynamic metadata, before the decision is
                  # asked for, so the decider can use `mcp_tool` in a rule.
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: /tmp/mcp.lua
                  # Second, tiny Lua filter: it turns the tunnel decision the
                  # first one fetched into a header while the headers can still
                  # be continued, which is the only moment Envoy re-resolves the
                  # route (see extensions/route.lua).
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: /tmp/route.lua
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # Which client headers the control API may see. `Host`,
                      # `Method`, `Path`, `Content-Length` and `Authorization`
                      # are always included; these are the ones it needs on top.
                      # This is the top-level field, not the deprecated
                      # `http_service.authorization_request.allowed_headers`.
                      allowed_headers:
                        patterns:
                          # Set by the Lua filter from the connection, never copied
                          # from the client: it is how the control API learns
                          # which sandbox is asking.
                          - exact: x-nestbox-source-ip
                          - exact: user-agent
                          - exact: mcp-session-id
                      http_service:
                        server_uri:
                          uri: http://control-api:8000
                          cluster: control_api
                          timeout: 1s
                        # Envoy appends the original request path to
                        # `path_prefix`; the control API registers the exact
                        # path and the suffixed form.
                        path_prefix: /api/v1/internal/policy/check
                        # This node's identity and token. They are filled in when
                        # the container starts (`start-egress-proxy.sh`) and they
                        # override anything the client sent under the same names,
                        # so a sandbox cannot present its own. Without them the
                        # control API answers 401 and every request is denied.
                        authorization_request:
                          headers_to_add:
                            - key: x-nestbox-node
                              value: "__NESTBOX_NODE_ID__"
                            - key: authorization
                              value: "Bearer __NESTBOX_NODE_TOKEN__"
                        authorization_response:
                          # The decider answers with these headers and Envoy
                          # copies them into the ext_authz filter metadata.
                          # Neither the sandbox nor the destination host sees
                          # them: they are for the access log only.
                          dynamic_metadata_from_headers:
                            patterns:
                              - exact: x-nestbox-decision
                              - exact: x-nestbox-reason
                              - exact: x-nestbox-rule-id
                              - exact: x-nestbox-sandbox
                              # A window or an allow-all mode let the request
                              # through although a rule would have denied it.
                              - exact: x-nestbox-would-deny
                      # Fail closed. A control API that cannot answer is not
                      # permission to proceed.
                      failure_mode_allow: false
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config:
                        name: dynamic_forward_proxy_cache
                        dns_lookup_family: V4_ONLY
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ---------------------------------------------------------------------
    # 2. Loopback listener for requests the broker already decrypted.
    # ---------------------------------------------------------------------
    # TLS only. The broker re-encrypts with the client's original SNI, so
    # `%REQUESTED_SERVER_NAME%` is the real server name from the handshake and
    # the access log can say what the sandbox actually asked for.
    #
    # The certificate here is not the node CA's leaf: it is a self-signed
    # loopback certificate generated at image build time (see the Dockerfile).
    # The broker connects to 127.0.0.1 and does not verify it; nothing outside
    # this container can reach this port.
    - name: egress_terminated
      address:
        socket_address: { address: 127.0.0.1, port_value: 10000 }
      # `tls_inspector` is not optional here even though the filter chain does
      # not match on it: Envoy records the SNI on the *socket* from the
      # inspector's ClientHello parse, and `%REQUESTED_SERVER_NAME%` reads it
      # from there. Without the inspector the log field is empty.
      listener_filters:
        # Restores the sandbox's address from the broker's header. Loopback only,
        # so nothing outside the container can claim an address.
        - name: envoy.filters.listener.proxy_protocol
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.proxy_protocol.v3.ProxyProtocol
            rules: []
        - name: envoy.filters.listener.tls_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/tls/loopback.crt
                    private_key:
                      filename: /etc/envoy/tls/loopback.key
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_terminated
                codec_type: AUTO
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 127.0.0.0
                      prefix_len: 8
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          ts: "%START_TIME%"
                          node: "%ENVIRONMENT(NESTBOX_NODE_NAME)%"
                          listener: terminated
                          sandbox: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-nestbox-sandbox)%"
                          host: "%REQ(:authority)%"
                          target_host: "%DYNAMIC_METADATA(nestbox:target_host)%"
                          target_port: "%DYNAMIC_METADATA(nestbox:target_port)%"
                          method: "%REQ(:method)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          # No value here: this listener never sees a CONNECT.
                          connect: "%DYNAMIC_METADATA(nestbox:connect)%"
                          # The real SNI from the ClientHello the broker
                          # forwarded — this is the handshake, not a guess.
                          sni: "%REQUESTED_SERVER_NAME%"
                          protocol: "%PROTOCOL%"
                          app_protocol: "%DYNAMIC_METADATA(nestbox:app_protocol)%"
                          status: "%RESPONSE_CODE%"
                          duration_ms: "%DURATION%"
                          bytes_in: "%BYTES_RECEIVED%"
                          bytes_out: "%BYTES_SENT%"
                          user_agent: "%REQ(user-agent)%"
                          request_id: "%REQ(x-request-id)%"
                          mcp_session_id: "%DYNAMIC_METADATA(nestbox:mcp_session_id)%"
                          mcp_method: "%DYNAMIC_METADATA(nestbox:mcp_method)%"
                          mcp_tool: "%DYNAMIC_METADATA(nestbox:mcp_tool)%"
                          mcp_is_error: "%DYNAMIC_METADATA(nestbox:mcp_is_error)%"
                          mcp_result_kind: "%DYNAMIC_METADATA(nestbox:mcp_result_kind)%"
                          request_body: "%DYNAMIC_METADATA(nestbox:request_body)%"
                          response_body: "%DYNAMIC_METADATA(nestbox:response_body)%"
                          usage: "%DYNAMIC_METADATA(nestbox:usage)%"
                          cache_markers: "%DYNAMIC_METADATA(nestbox:cache_markers)%"
                          llm_auth: "%DYNAMIC_METADATA(nestbox:llm_auth)%"
                          decision: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-nestbox-decision)%"
                          # 1 when only a window or an allow-all mode let this
                          # through; the decision above is then allow.
                          would_deny: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-nestbox-would-deny)%"
                          reason: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-nestbox-reason)%"
                          rule_id: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-nestbox-rule-id)%"
                          # What the content check did: blocked, replaced,
                          # pseudonymized, unavailable, too_large. Empty when the
                          # check does not apply to this request.
                          dlp: "%RESP(X-NESTBOX-DLP)%"
                          # What the content check did: blocked, replaced,
                          # pseudonymized, unavailable, too_large. Empty when the
                          # check does not apply to this request.
                          dlp: "%RESP(X-NESTBOX-DLP)%"
                route_config:
                  name: egress_terminated
                  virtual_hosts:
                    - name: forward
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: egress_reencrypt
                            timeout: 300s
                            idle_timeout: 60s
                http_filters:
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 4194304
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: /tmp/mcp.lua
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      allowed_headers:
                        patterns:
                          # Set by the Lua filter from the connection, never copied
                          # from the client: it is how the control API learns
                          # which sandbox is asking.
                          - exact: x-nestbox-source-ip
                          - exact: user-agent
                          - exact: mcp-session-id
                      http_service:
                        server_uri:
                          uri: http://control-api:8000
                          cluster: control_api
                          timeout: 1s
                        path_prefix: /api/v1/internal/policy/check
                        # This node's identity and token. They are filled in when
                        # the container starts (`start-egress-proxy.sh`) and they
                        # override anything the client sent under the same names,
                        # so a sandbox cannot present its own. Without them the
                        # control API answers 401 and every request is denied.
                        authorization_request:
                          headers_to_add:
                            - key: x-nestbox-node
                              value: "__NESTBOX_NODE_ID__"
                            - key: authorization
                              value: "Bearer __NESTBOX_NODE_TOKEN__"
                        authorization_response:
                          dynamic_metadata_from_headers:
                            patterns:
                              - exact: x-nestbox-decision
                              - exact: x-nestbox-reason
                              - exact: x-nestbox-rule-id
                              - exact: x-nestbox-sandbox
                              # A window or an allow-all mode let the request
                              # through although a rule would have denied it.
                              - exact: x-nestbox-would-deny
                          # The broker that re-encrypts this hop is where a body
                          # is checked against the privacy policy: it holds the
                          # decrypted bytes and can rewrite them, which the router
                          # cannot. It needs to know whose body it is and what the
                          # egress mode allows when the check itself cannot be
                          # answered. Both come from the answer above, so a sandbox
                          # cannot write them (the Lua filter removes every
                          # `x-nestbox-*` header from the client first).
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-nestbox-sandbox
                              - exact: x-nestbox-egress-mode
                      failure_mode_allow: false
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: dynamic_forward_proxy_cluster
      connect_timeout: 2s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config:
            name: dynamic_forward_proxy_cache
            dns_lookup_family: V4_ONLY
    # What the terminated hop leaves through: the certificate broker's second
    # port, which encrypts the request again towards the host it names and
    # checks that server's certificate (mitm/upstream.go). A plain HTTP/1.1 hop on
    # loopback; the broker being down is a 503, never an unverified request.
    - name: egress_reencrypt
      connect_timeout: 2s
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
      load_assignment:
        cluster_name: egress_reencrypt
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 10002 }
    # The certificate broker. An endpoint that is down here is an HTTPS request
    # that fails closed: the client gets a 503 instead of an unverified tunnel.
    - name: tls_terminator
      connect_timeout: 2s
      type: STATIC
      # The sandbox's address travels to the broker as a PROXY protocol header,
      # because the decrypted request reaches the inner listener from loopback.
      transport_socket:
        name: envoy.transport_sockets.upstream_proxy_protocol
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.proxy_protocol.v3.ProxyProtocolUpstreamTransport
          config: { version: V1 }
          transport_socket:
            name: envoy.transport_sockets.raw_buffer
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer
      load_assignment:
        cluster_name: tls_terminator
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 10001 }
    - name: control_api
