# Release: build and sign the images, attach the installer and the compose bundle (ADR 0050).
#
# Push a tag like v1.0.0. Images go to GHCR for amd64 and arm64, are signed with cosign (keyless,
# the workflow's own identity), and carry the tag. Verify with:
#   cosign verify ghcr.io/matthias1232/nestbox-control-api:v1.0.0 \
#     --certificate-identity-regexp 'https://github.com/matthias1232/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: nestbox-control-api, context: services, file: services/control-api-rust/Dockerfile }
          - { name: nestbox-web-console, context: services/web-console-solid, file: services/web-console-solid/Dockerfile }
          - { name: nestbox-sandbox-runner, context: services/sandbox-runner, file: services/sandbox-runner/Dockerfile }
          - { name: nestbox-egress-proxy, context: services/egress-proxy, file: services/egress-proxy/Dockerfile }
          - { name: nestbox-overlay-hub, context: deploy/overlay-hub, file: deploy/overlay-hub/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Sign by digest
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

  bundle:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pack the compose bundle
        run: |
          tar -czf nestbox-${{ github.ref_name }}.tar.gz \
            deploy/docker-compose.yml deploy/docker-compose.images.yml deploy/install.sh \
            deploy/overlay-hub deploy/scripts docs/guides
          sha256sum nestbox-${{ github.ref_name }}.tar.gz deploy/install.sh > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nestbox-${{ github.ref_name }}.tar.gz
            deploy/install.sh
            SHA256SUMS
